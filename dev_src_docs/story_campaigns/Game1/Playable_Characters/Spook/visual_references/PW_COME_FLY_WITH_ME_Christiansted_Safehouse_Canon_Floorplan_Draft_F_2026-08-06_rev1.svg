  <g id="revision-note">
    <rect x="988" y="676" width="495" height="170" rx="8" class="callout"/>
    <text x="1010" y="706" class="small" style="font-weight:700">Draft F corrections applied</text>
    <text x="1010" y="735" class="tiny">1. Removed the west corridor segment and enlarged the main ops room northward.</text>
    <text x="1010" y="759" class="tiny">2. Added the new corridor-end wall and door at the marked position.</text>
    <text x="1010" y="783" class="tiny">3. Relocated the ready-room lower door to the marked right-side position.</text>
    <text x="1010" y="807" class="tiny">4. Retained the accepted bath and kitchen windows and Draft D service details.</text>
  </g>

  <text x="36" y="873" class="tiny">Editable SVG reference. Draft F supersedes Draft E for current spatial iteration; production dimensions remain open.</text>
</svg>
