<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900">
  <title>Project Warriors — COME FLY WITH ME Safehouse Floor Plan, Canon Draft A</title>
  <desc>Editable SVG blockout draft based on the supplied apartment plan, relabeled and lightly reshaped to match the currently locked safehouse concept.</desc>

  <style>
    .title { font: 34px Arial, Helvetica, sans-serif; font-weight: 600; fill: #3f3f3f; }
    .subtitle { font: 20px Arial, Helvetica, sans-serif; fill: #666; }
    .label { font: 26px Arial, Helvetica, sans-serif; font-weight: 600; fill: #424242; }
    .room { font: 22px Arial, Helvetica, sans-serif; fill: #424242; }
    .small { font: 18px Arial, Helvetica, sans-serif; fill: #555; }
    .tiny { font: 16px Arial, Helvetica, sans-serif; fill: #666; }
    .wall { stroke: #000; stroke-width: 9; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
    .thin { stroke: #bfc3c7; stroke-width: 3; fill: none; }
    .note-line { stroke: #848484; stroke-width: 2; fill: none; }
    .arrow { fill: #000; }
    .zone-balcony { fill: #efefef; }
    .zone-front { fill: #f7f7f7; }
    .zone-core { fill: #fbfbfb; }
    .callout { fill: #f3f6f8; stroke: #c8d0d6; stroke-width: 2; }
  </style>

  <rect x="0" y="0" width="1536" height="900" fill="#fff"/>

  <g id="header">
    <text x="44" y="62" class="title">PROJECT WARRIORS — COME FLY WITH ME SAFEHOUSE</text>
    <text x="44" y="94" class="subtitle">Canon floor-plan draft A — editable schematic derived from the supplied apartment envelope</text>
  </g>

  <!-- balcony / street frontage -->
  <g id="frontage">
    <rect x="34" y="642" width="970" height="156" class="zone-balcony"/>
    <path d="M34 642 V798 H1004 V642" class="thin"/>
    <text x="380" y="696" class="label">FRONT BALCONY / STREET FRONTAGE</text>
    <text x="270" y="726" class="small">accessible from the balcony parlor; player can look down toward the team’s black SUV</text>
    <text x="292" y="756" class="small">street-facing shutters and filtered daylight define the apartment’s front side</text>
  </g>

  <!-- plan background fills -->
  <g id="fills">
    <rect x="31" y="174" width="987" height="469" class="zone-front"/>
    <rect x="1183" y="139" width="303" height="504" class="zone-core"/>
  </g>

  <!-- Entry text and arrow -->
  <g id="entry">
    <text x="1010" y="132" class="label">REAR ENTRY / STAIRS</text>
    <polygon class="arrow" points="1094,162 1128,222 1162,162"/>
    <text x="1014" y="242" class="tiny">visible exit geometry; departure remains inactive</text>
    <text x="1014" y="264" class="tiny">until the player speaks to Tripper</text>
  </g>

  <!-- walls / reshaped geometry -->
  <g id="walls">
    <!-- outer shell -->
    <path class="wall" d="M29 174 H1018"/>
    <path class="wall" d="M29 174 V632"/>
    <path class="wall" d="M29 632 H149"/>
    <path class="wall" d="M389 632 H688"/>
    <path class="wall" d="M928 632 H1486"/>
    <path class="wall" d="M1486 139 V632"/>
    <path class="wall" d="M1184 139 H1486"/>
    <path class="wall" d="M1184 139 V174"/>
    <path class="wall" d="M1184 174 H1210"/>
    <path class="wall" d="M1457 174 H1486"/>
    <path class="wall" d="M1457 139 V174"/>

    <!-- central hall / corridor spine -->
    <path class="wall" d="M267 279 H997"/>
    <path class="wall" d="M1145 279 H1486"/>

    <!-- balcony parlor partition -->
    <path class="wall" d="M566 279 V631"/>
    <path class="wall" d="M566 279 H692"/>

    <!-- service core / right room split -->
    <path class="wall" d="M955 279 H1052"/>
    <path class="wall" d="M1186 279 H1486"/>
    <path class="wall" d="M1074 409 H1177"/>
    <path class="wall" d="M1074 409 V631"/>
    <path class="wall" d="M1177 409 V479"/>
    <path class="wall" d="M1177 479 H1223"/>
    <path class="wall" d="M1223 479 V631"/>
    <path class="wall" d="M1177 409 H1233"/>
    <path class="wall" d="M1233 409 V519"/>
    <path class="wall" d="M1233 519 H1193"/>
    <path class="wall" d="M1187 487 H1282"/>

    <!-- kitchen / team hub -->
    <path class="wall" d="M1215 174 V248"/>
    <path class="wall" d="M1215 174 H1429"/>
    <path class="wall" d="M1429 174 V248"/>
  </g>

  <!-- room labels -->
  <g id="labels">
    <text x="472" y="243" class="label">CENTRAL HALL / CORRIDOR</text>
    <text x="144" y="381" class="label">MAIN LIVING / OPS ROOM</text>
    <text x="144" y="414" class="room">dark atmospheric hub, couch, laptop, radio, antique fan, folded cot</text>
    <text x="643" y="399" class="label">BALCONY PARLOR</text>
    <text x="622" y="431" class="room">front room with shutters and balcony access</text>
    <text x="1231" y="205" class="room" style="font-weight:600">KITCHEN / TEAM</text>
    <text x="1270" y="230" class="room" style="font-weight:600">TABLE</text>
    <text x="1227" y="252" class="tiny">Tripper + Smoke default</text>
    <text x="1255" y="272" class="tiny">working anchor</text>
    <text x="1250" y="379" class="room" style="font-weight:600">EQUIPMENT +</text>
    <text x="1263" y="405" class="room" style="font-weight:600">SLEEP ROOM</text>
    <text x="1250" y="431" class="tiny">loadout, cases, spare</text>
    <text x="1275" y="451" class="tiny">bedding, storage</text>
    <text x="1051" y="553" class="room" transform="rotate(-90 1051,553)">BATH</text>
    <text x="1192" y="576" class="room" transform="rotate(-90 1192,576)">UTILITY / WASH</text>
  </g>

  <!-- optional gameplay anchors -->
  <g id="anchors">
    <line x1="210" y1="520" x2="305" y2="520" class="note-line"/>
    <text x="313" y="510" class="small">likely folded-cot wall</text>
    <text x="313" y="533" class="tiny">rare ambient rest behavior</text>

    <line x1="182" y1="324" x2="303" y2="289" class="note-line"/>
    <text x="314" y="284" class="small">ops desk + slow fan</text>

    <line x1="291" y1="565" x2="407" y2="565" class="note-line"/>
    <text x="416" y="555" class="small">couch / coffee table / terminal laptop</text>

    <line x1="1328" y1="323" x2="1328" y2="270" class="note-line"/>
    <text x="1214" y="326" class="tiny">readiness talk with</text>
    <text x="1249" y="346" class="tiny">Tripper</text>

    <line x1="1338" y1="489" x2="1292" y2="518" class="note-line"/>
    <text x="1244" y="547" class="tiny">primary loadout</text>
    <text x="1245" y="567" class="tiny">interaction zone</text>
  </g>

  <!-- side callout -->
  <g id="notes">
    <rect x="1033" y="692" width="450" height="150" rx="8" ry="8" class="callout"/>
    <text x="1054" y="723" class="small">Blockout intent:</text>
    <text x="1054" y="752" class="tiny">• living room = atmospheric exploration hub</text>
    <text x="1054" y="776" class="tiny">• kitchen = shared teammate work area and departure-prep hub</text>
    <text x="1054" y="800" class="tiny">• equipment room = practical loadout / storage / overflow sleeping space</text>
    <text x="1054" y="824" class="tiny">• exit remains visible but does not advance the mission on contact</text>
  </g>

  <text x="35" y="872" class="tiny">Editable SVG reference. Partitions, labels, balcony footprint, and gameplay callouts may be revised in later passes.</text>
</svg>
