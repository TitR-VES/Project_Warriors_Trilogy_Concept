<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900">
  <title>Project Warriors — COME FLY WITH ME Safehouse Floor Plan, Canon Draft E</title>
  <desc>Editable safehouse floor-plan schematic. Draft E shortens the corridor to enlarge the main room and parlor footprint, and adds south-facing bathroom and kitchen windows while retaining the Draft D ready-room and kitchen-service refinements.</desc>

  <style>
    .title { font: 34px Arial, Helvetica, sans-serif; font-weight: 700; fill: #343434; }
    .subtitle { font: 20px Arial, Helvetica, sans-serif; fill: #666; }
    .room-label { font: 24px Arial, Helvetica, sans-serif; font-weight: 700; fill: #3c3c3c; text-anchor: middle; }
    .room-note { font: 17px Arial, Helvetica, sans-serif; fill: #555; text-anchor: middle; }
    .small { font: 18px Arial, Helvetica, sans-serif; fill: #555; }
    .tiny { font: 15px Arial, Helvetica, sans-serif; fill: #666; }
    .wall { stroke: #111; stroke-width: 10; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
    .door { stroke: #777; stroke-width: 3; fill: none; }
    .window { stroke: #6d8797; stroke-width: 5; fill: none; }
    .shutter { stroke: #8799a3; stroke-width: 2; }
    .counter { stroke: #6f7d85; stroke-width: 6; fill: none; stroke-linecap: square; stroke-linejoin: round; }
    .balcony-edge { stroke: #adb6bc; stroke-width: 3; fill: none; }
    .arrow { fill: #111; }
    .fill-living { fill: #f7f7f5; }
    .fill-parlor { fill: #f2f5f6; }
    .fill-corridor { fill: #fbfbfb; }
    .fill-equipment { fill: #f5f2ed; }
    .fill-kitchen { fill: #f3f6f1; }
    .fill-service { fill: #f6f6f6; }
    .fill-balcony { fill: #eceff1; }
    .callout { fill: #f5f7f8; stroke: #ccd3d8; stroke-width: 2; }
  </style>

  <rect width="1536" height="900" fill="#fff"/>

  <g id="header">
    <text x="44" y="58" class="title">PROJECT WARRIORS — COME FLY WITH ME SAFEHOUSE</text>
    <text x="44" y="91" class="subtitle">Canon floor-plan Draft E — shortened corridor, enlarged front rooms, and added bathroom/kitchen windows</text>
  </g>

  <!-- Draft E shortens the corridor from 135px to 100px depth -->
  <g id="fills">
    <rect x="34" y="180" width="532" height="452" class="fill-living"/>
    <rect x="566" y="280" width="438" height="352" class="fill-parlor"/>
    <rect x="34" y="180" width="970" height="100" class="fill-corridor"/>
    <rect x="1184" y="145" width="302" height="135" class="fill-equipment"/>
    <rect x="1184" y="280" width="302" height="352" class="fill-kitchen"/>
    <rect x="1065" y="395" width="169" height="237" class="fill-service"/>
    <rect x="566" y="645" width="438" height="135" class="fill-balcony"/>
  </g>

  <!-- Outer shell with right-façade window gaps -->
  <g id="outer-walls">
    <path class="wall" d="M29 180 H1018"/>
    <path class="wall" d="M29 180 V632"/>

    <!-- south/front wall: ops room windows, parlor balcony doors, added bath and kitchen windows -->
    <path class="wall" d="M29 632 H105"/>
    <path class="wall" d="M225 632 H300"/>
    <path class="wall" d="M420 632 H566"/>
    <path class="wall" d="M566 632 H680"/>
    <path class="wall" d="M910 632 H1004"/>
    <path class="wall" d="M1004 632 H1105"/>
    <path class="wall" d="M1186 632 H1260"/>
    <path class="wall" d="M1410 632 H1486"/>

    <path class="wall" d="M1184 145 H1486"/>
    <path class="wall" d="M1184 145 V180"/>
    <path class="wall" d="M1184 180 H1210"/>
    <path class="wall" d="M1458 180 H1486"/>
    <path class="wall" d="M1458 145 V180"/>

    <!-- right exterior wall broken for two vent windows and one kitchen window -->
    <path class="wall" d="M1486 145 V205"/>
    <path class="wall" d="M1486 227 V250"/>
    <path class="wall" d="M1486 272 V425"/>
    <path class="wall" d="M1486 535 V632"/>
  </g>

  <g id="openings">
    <!-- ops room south windows -->
    <path class="window" d="M108 632 H222"/>
    <path class="window" d="M303 632 H417"/>
    <path class="shutter" d="M125 620 V644 M148 620 V644 M171 620 V644 M194 620 V644"/>
    <path class="shutter" d="M320 620 V644 M343 620 V644 M366 620 V644 M389 620 V644"/>

    <!-- parlor balcony doors -->
    <path class="door" d="M680 632 V530"/>
    <path class="door" d="M910 632 V530"/>
    <path class="door" d="M680 530 H910"/>
    <path class="shutter" d="M715 530 V632 M750 530 V632 M785 530 V632 M820 530 V632 M855 530 V632 M890 530 V632"/>

    <!-- added south-facing bath window -->
    <path class="window" d="M1108 632 H1182"/>
    <path class="shutter" d="M1124 620 V644 M1145 620 V644 M1166 620 V644"/>

    <!-- added south-facing kitchen window -->
    <path class="window" d="M1263 632 H1407"/>
    <path class="shutter" d="M1288 620 V644 M1314 620 V644 M1340 620 V644 M1366 620 V644 M1392 620 V644"/>

    <!-- right-façade windows -->
    <path class="window" d="M1486 206 V226"/>
    <path class="window" d="M1486 251 V271"/>
    <path class="window" d="M1486 426 V534"/>
    <path class="shutter" d="M1473 452 H1499 M1473 480 H1499 M1473 508 H1499"/>
  </g>

  <!-- Corridor partitions and living/parlor link -->
  <g id="corridor-partitions">
    <path class="wall" d="M267 280 H1000"/>
    <path class="wall" d="M1145 280 H1184"/>

    <!-- Living/parlor dividing wall extends upward due to shorter corridor; passage retained -->
    <path class="wall" d="M566 280 V325"/>
    <path class="wall" d="M566 395 V632"/>
    <path class="wall" d="M566 280 H690"/>

    <path class="wall" d="M955 280 H1055"/>
    <!-- top edge of kitchen/ready side begins after ready-room lower opening -->
    <path class="wall" d="M1225 280 H1486"/>
  </g>

  <!-- Ready room refined envelope with two passages, adjusted to shorter corridor -->
  <g id="equipment-room-boundary">
    <path class="wall" d="M1184 180 V218"/>
    <path class="wall" d="M1184 237 V280"/>
  </g>

  <!-- Bath / utility wet core; shifted upward with room extension -->
  <g id="service-core">
    <!-- Bath with west-side access from balcony parlor -->
    <path class="wall" d="M1068 395 H1176"/>
    <path class="wall" d="M1068 395 V427"/>
    <path class="wall" d="M1068 487 V632"/>
    <path class="wall" d="M1176 395 V460"/>

    <!-- Utility/wash with north-side access from parlor/hall/kitchen transition -->
    <path class="wall" d="M1176 460 H1222"/>
    <path class="wall" d="M1222 460 V632"/>
    <path class="wall" d="M1176 395 H1188"/>
    <path class="wall" d="M1220 395 H1234"/>
    <path class="wall" d="M1234 395 V495"/>
    <path class="wall" d="M1234 495 H1192"/>
  </g>

  <!-- Kitchen counter / sink placement remains plumbing-aware; shifted upward slightly -->
  <g id="kitchen-counter">
    <path class="counter" d="M1276 430 H1310 V574 H1472"/>
    <text x="1374" y="563" class="tiny" text-anchor="middle">counter + sink run</text>
  </g>

  <g id="balcony">
    <path class="balcony-edge" d="M566 645 V780 H1004 V645"/>
    <text x="785" y="700" class="room-label">BALCONY</text>
    <text x="785" y="730" class="room-note">parlor frontage only • street / SUV view</text>
  </g>

  <g id="entry">
    <text x="1005" y="128" class="small" style="font-weight:700">REAR ENTRY / STAIRS</text>
    <polygon class="arrow" points="1088,153 1122,211 1156,153"/>
  </g>

  <g id="room-labels">
    <text x="620" y="232" class="room-label">SHORTENED CENTRAL HALL / CORRIDOR</text>
    <text x="620" y="262" class="room-note">shallower hall extends the front rooms while preserving the main interior route</text>

    <text x="298" y="405" class="room-label">MAIN LIVING / OPS ROOM</text>
    <text x="298" y="437" class="room-note">dark atmospheric hub • couch • terminal laptop</text>
    <text x="298" y="462" class="room-note">radio • antique fan • folded cot • intel residue</text>
    <text x="298" y="594" class="tiny" style="text-anchor:middle">SHUTTERED WINDOWS ONLY — NO BALCONY DOOR</text>

    <text x="785" y="415" class="room-label">BALCONY PARLOR</text>
    <text x="785" y="447" class="room-note">brighter front room with sole balcony access</text>
    <text x="785" y="594" class="tiny" style="text-anchor:middle">SHUTTERED DOUBLE DOORS TO BALCONY</text>

    <text x="1335" y="205" class="room-note" style="font-weight:700; font-size:18px">EQUIPMENT / READY ROOM</text>
    <text x="1335" y="233" class="room-note">departure staging + compact loadout</text>
    <text x="1335" y="257" class="room-note">cases • weapons • packed gear</text>

    <text x="1340" y="385" class="room-label" style="font-size:22px">KITCHEN / TEAM TABLE HUB</text>
    <text x="1340" y="416" class="room-note">shared workspace for Tripper and Smoke</text>
    <text x="1340" y="442" class="room-note">signal analysis • maps • equipment sorting</text>
    <text x="1340" y="603" class="tiny">south and right-side kitchen windows now represented</text>

    <text x="1125" y="603" class="tiny">bath window added to south frontage</text>

    <text x="1050" y="573" class="tiny" transform="rotate(-90 1050 573)">BATH</text>
    <text x="1196" y="594" class="tiny" transform="rotate(-90 1196 594)">UTILITY / WASH</text>
  </g>

  <g id="anchors">
    <circle cx="180" cy="334" r="5" fill="#777"/>
    <text x="194" y="340" class="tiny">ops desk + slow fan</text>

    <circle cx="220" cy="520" r="5" fill="#777"/>
    <text x="234" y="526" class="tiny">couch / coffee table / terminal</text>

    <circle cx="505" cy="490" r="5" fill="#777"/>
    <text x="490" y="482" class="tiny" text-anchor="end">folded-cot wall</text>
    <text x="490" y="502" class="tiny" text-anchor="end">rare ambient rest state</text>

    <circle cx="1335" cy="475" r="5" fill="#777"/>
    <text x="1335" y="495" class="tiny" text-anchor="middle">shared table / readiness conversation</text>

    <circle cx="1335" cy="260" r="5" fill="#777"/>
    <text x="1335" y="278" class="tiny" text-anchor="middle">primary loadout interaction</text>
  </g>

  <g id="revision-note">
    <rect x="998" y="676" width="485" height="170" rx="8" class="callout"/>
    <text x="1020" y="706" class="small" style="font-weight:700">Draft E refinements applied</text>
    <text x="1020" y="735" class="tiny">1. Corridor depth reduced to extend the main ops room and balcony parlor upward.</text>
    <text x="1020" y="759" class="tiny">2. Living/parlor dividing wall and passage moved to match the new corridor depth.</text>
    <text x="1020" y="783" class="tiny">3. Added a south-facing bath window and a south-facing kitchen window.</text>
    <text x="1020" y="807" class="tiny">4. Draft D ready-room shape, right-façade windows, and kitchen counter remain retained.</text>
  </g>

  <text x="36" y="873" class="tiny">Editable SVG reference. Draft E supersedes Draft D for current spatial iteration; production dimensions remain open.</text>
</svg>
