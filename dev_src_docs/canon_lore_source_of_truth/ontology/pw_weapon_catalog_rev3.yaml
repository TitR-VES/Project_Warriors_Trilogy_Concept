    - SANDMAN's persistent weapon light is a Streamlight TLR-3 mounted distinctly low below the bore, with its switch paddle high enough for natural finger access.
    - SANDMAN's canonical suppressor is the SilencerCo Osprey 45 2.0, measuring just under seven inches.
    - Earlier Osprey SHS and eight-inch suppressor references are superseded and must not be restored.
    - SANDMAN's five quantified malfunction profiles supersede the earlier low-absolute-risk and maintained-M1911 comparison wherever inconsistent.
    - Guide-rod walk-out uses a 2.5% per-shot first-magazine check, then 50% and 96% per-magazine checks for the second and later sustained-fire magazines.
    - Mace's TROOPER is a DSA SA58 OSW in 7.62x51mm NATO with a 1-4x LPVO, a forward 3 o'clock handguard white light, and a removable mission-conditioned suppressor.
