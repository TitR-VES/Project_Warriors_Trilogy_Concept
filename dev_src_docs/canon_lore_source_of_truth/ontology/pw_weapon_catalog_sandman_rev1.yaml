      platform identity. Standard 9x19mm is the initial common ammunition lane. Subsonic
      9x19mm unlocks later for the quietest suppressed state. The Osprey's forward mass
      noticeably slows ADS and slightly reduces repeated-shot stability. Simple stoppages
      use Hawthorne's practiced rapid immediate-action animation through the contextual
      restore-to-ready input; complex clears retain physically honest persistent state.

