    notes: >-
      Hawthorne has carried SANDMAN since his early Kill Devil Hills Detachment period.
      It predates his later New American Frontier and Vanguard affiliations. The Streamlight
      TLR-3 remains part of the persistent base configuration; its compact body sits visibly
      low under the bore but its paddle remains reachable without an exaggerated grip shift.
      Suppressed use means fitting the specified removable Osprey 45 2.0 rather than creating
      a separate platform identity. Standard 9x19mm is the initial common ammunition lane.
      Subsonic 9x19mm unlocks later for the quietest suppressed state. The Osprey's forward
      mass noticeably slows ADS and slightly reduces repeated-shot stability. SANDMAN's five
      quantified malfunction profiles inherit the contextual restore-to-ready and persistent
      state system. Routine failures cannot permanently discard the named weapon.

