ammunition:
  - id: PW-AMM-9X19-SUB
    designation: 9x19mm subsonic
    ammunition_type: cartridge
    economy_role: later_game_suppressed_specialist
    status: confirmed
    sources: [SANDMAN, REG10]
    compatible_weapon_refs: [PW-WEP-HUDSON-H9]
    notes: >-
      Later-game SANDMAN ammunition lane. When used with the removable black flat-sided
      just-under-seven-inch SilencerCo Osprey 45 2.0 suppressor, it produces SANDMAN's
      strongest shot-report reduction, with a slight damage and effective-range reduction
      relative to standard 9x19mm. The suppressor's forward-weight handling penalties remain
      active. Compatibility may be broadened only through later source-backed weapon passes.

weapons:
  - id: PW-WEP-HUDSON-H9
    canonical_name: Hudson H9
    model_year: 2019
    category: pistol
    action: striker_fired
    weapon_scope: portable_weapon
    status: confirmed
    ammunition_refs: [PW-AMM-9X19, PW-AMM-9X19-SUB]
    sources: [SANDMAN, REG10]
    named_build_refs: [PW-WPN-HAWTHORNE-SANDMAN]
    occurrence_refs: [PW-WOC-WAR-WITHIN-HUDSON-H9]
    notes: >-
      The project-specific Hawthorne build has a tan/FDE primary finish, black polymer
      grip panels and a threaded barrel. Its canonical removable suppressor is a black,
      flat-sided, just-under-seven-inch SilencerCo Osprey 45 2.0. The two-tone finish
      reinforces the SANDMAN name; the Hudson H9's unusual profile and elongated
      Osprey-equipped outline support the Logan's Run visual echo without replica styling.
      Unsuppressed gameplay identity: exceptionally soft recoil, very low muzzle rise, very
      fast ADS, high aim stability and rapid accurate follow-up shots. Suppressed identity:
      exceptional signature reduction, noticeably slower ADS and slightly lower repeated-
      follow-up stability because the forward mass shifts the center of gravity toward the
      muzzle. Standard 9x19mm is common and relatively inexpensive; the later subsonic lane
      trades slight damage and range for the strongest suppressed sound reduction. Reliability
      is slightly below the regular maintained M1911 reference lane and uses condition-driven
      persistent malfunction states rather than frequent arbitrary random jams.

