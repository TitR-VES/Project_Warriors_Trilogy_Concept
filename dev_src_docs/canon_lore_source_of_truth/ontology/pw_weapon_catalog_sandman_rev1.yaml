weapons:
  - id: PW-WEP-HUDSON-H9
    canonical_name: Hudson H9
    model_year: 2019
    category: pistol
    action: striker_fired
    weapon_scope: portable_weapon
    status: confirmed
    ammunition_refs: [PW-AMM-9X19, PW-AMM-9X19-SUB]
    sources: [SANDMAN, REG10]
    named_build_refs: [PW-WPN-HAWTHORNE-SANDMAN]
    occurrence_refs: [PW-WOC-WAR-WITHIN-HUDSON-H9]
    malfunction_profile_refs:
      - PW-MAL-SANDMAN-GUIDE-ROD-WALKOUT
      - PW-MAL-SANDMAN-FIRST-ROUND-CHOKE
      - PW-MAL-SANDMAN-STIFF-MAGAZINE-EXTRACTION
      - PW-MAL-SANDMAN-SLIDE-CATCH-SLINGSHOT
      - PW-MAL-SANDMAN-IN-CYCLE-FEED-CHOKE
    notes: >-
      The project-specific Hawthorne build has a tan/FDE primary finish, black polymer
      grip panels, a threaded barrel and a Streamlight TLR-3 weapon light. The TLR-3 body
      mounts distinctly low below the bore while its switch paddle remains high enough for
      natural finger access from the firing grip. Its canonical removable suppressor is a
      black, flat-sided, just-under-seven-inch SilencerCo Osprey 45 2.0. The two-tone finish,
      low-mounted light and elongated Osprey-equipped outline support the Logan's Run visual
      echo without replica styling. Unsuppressed gameplay identity: exceptionally soft recoil,
      very low muzzle rise, very fast ADS, high aim stability and rapid accurate follow-up
      shots. Suppressed identity: exceptional signature reduction, noticeably slower ADS and
      slightly lower repeated-follow-up stability because the forward mass shifts the center
      of gravity toward the muzzle. Standard 9x19mm is common and relatively inexpensive; the
      later subsonic lane trades slight damage and range for the strongest suppressed sound
      reduction. Reliability is controlled by the five quantified SANDMAN malfunction profiles.
      Earlier low-absolute-risk and maintained-M1911 comparison language is superseded where
      inconsistent with those rates.

