- id: PW-CONT-G2-ROMEO-CUMBERLAND-TOWN-ROUTE
  event_ref: PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    Preserve the controlling post-dropoff route: staging area -> University Inn suppression
    lane -> Holiday Tire -> Cumberland Gap Inn -> D & D -> marked LMU building -> post
    office -> Memorial Park -> Caboose parking lot -> Caboose Saloon -> Glushkin house ->
