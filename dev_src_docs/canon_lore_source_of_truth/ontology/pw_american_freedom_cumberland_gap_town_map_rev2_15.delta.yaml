      Cumberland Gap corridor and town; western tunnel checkpoint; Sparrow 5 town staging
      area; Holiday Tire road-control point; Cumberland Gap Inn; D & D machine-gun block;
      marked LMU town building; post office; Memorial Park; Caboose parking lot and saloon;
      Glushkin quiet house; eastern portal staging, overwatch, and checkpoint; southern
      mobile-element approach; Union College reference supply point.
    notes: >-
      After the western-portal Little Bird intervention, Sparrow 5 drops Romeo, Dingo, and
      Howler at the marked town staging area. Nearby motorized U.S. infantry suppresses the
      occupied University Inn while the player reaches and secures Holiday Tire. Romeo then
      clears Cumberland Gap Inn, calls the first player-requested mortar mission against the
      reinforced D & D position, clears the marked LMU building and post office, neutralizes
      the Memorial Park heavy-machine-gun vehicle, and reaches the Caboose parking lot. No
      player-callable mortar support exists before D & D or again until the Caboose lot. The
      second mortar mission breaks the exterior defense; Romeo clears the saloon as the last
      organized town holdout. Independently maneuvering U.S. elements intercept retreating
      occupiers at the marked parking lot. The Glushkin house is nearby, enabling a seamless
      first-person transition. Holiday Tire later becomes the northeast departure assembly
      point. Parallel forces secure the eastern portal from their own staging and overwatch
      positions. The two western-portal Tigrs originate from the marked enemy supply point.
