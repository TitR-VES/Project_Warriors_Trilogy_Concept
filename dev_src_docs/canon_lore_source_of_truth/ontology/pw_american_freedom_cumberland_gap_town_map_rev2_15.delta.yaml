    tactical and narrative functions without explicit later revision.

- id: PW-CONT-G2-ROMEO-CUMBERLAND-MORTARS
  event_ref: PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    The player does not call mortar fire at University Inn or before D & D. D & D is the
    first call and the only player-called mission near the dense central-town objectives.
    No further call is available through the LMU marker, post office, or Memorial Park.
    Mortar support returns only at the Caboose parking lot, where it breaks the exterior
    defense but does not clear the saloon interior.

- id: PW-CONT-G2-ROMEO-CUMBERLAND-PARALLEL-FORCES
  event_ref: PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    Eastern-portal forces and southern mobile U.S. elements possess their own objectives,
    timing, and awareness. They secure the eastern portal and intercept retreating
    occupiers without requiring Romeo to clear both portal checkpoints or travel to the
    interception lot. Holiday Tire road control enables their movement.

- id: PW-CONT-G2-ROMEO-CUMBERLAND-TIGR-ORIGIN
  event_ref: PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    The two Tigr-Ms reinforcing the western checkpoint originate from the marked enemy
    supply point at the Union College Environmental Education Center reference. Do not
    present them as spawning without an operational source.

- id: PW-CONT-G2-ROMEO-CUMBERLAND-GLUSHKIN-PROXIMITY
  event_ref: PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    The Glushkin house remains immediately adjacent to the final town holdout at planning
    scale, allowing the Caboose collapse to transition into the quiet-house confrontation
