continuity_constraints:
- id: PW-CONT-G2-ROMEO-PROLOGUE-TITLE
  event_ref: PW-EVT-G2-ROMEO-POST-CORONADO-PROLOGUE
  rule: >-
    The canonical prologue title is PATHFINDER. Treat the title as a description of Romeo's
    strategic function in finding, verifying, and preparing a viable human and operational
    route. Do not turn PATHFINDER into a callsign, unit designation, rank, or formal billet.

- id: PW-CONT-G2-ROMEO-PROLOGUE-PLACEMENT
  event_ref: PW-EVT-G2-ROMEO-POST-CORONADO-PROLOGUE
  rule: >-
    Place PATHFINDER after Romeo's Game 1 Coronado endpoint and before LOW GROUND. It must
    establish tasking and preparation without replacing LOW GROUND's uncertainty,
    reconnaissance, first local contact, or trust-building.

- id: PW-CONT-G2-ROMEO-PROLOGUE-RANK-AND-RECOGNITION
  event_ref: PW-EVT-G2-ROMEO-POST-CORONADO-PROLOGUE
  rule: >-
    Romeo's valor and achievements are recognized internally. The consequence is access
    to a more compartmented assignment, not an automatic promotion, public victory ceremony,
    or chosen-one status. Romeo remains SSG.

- id: PW-CONT-G2-ROMEO-PROLOGUE-INTELLIGENCE-CONFIDENCE
  event_ref: PW-EVT-G2-ROMEO-POST-CORONADO-PROLOGUE
  rule: >-
    Russian intercepts indicate low but persistent organized resistance activity around
    Calloway but do not reveal a mature American Freedom Corps, a known trustworthy cell,
    or a complete local intelligence picture. Romeo must still verify what exists.

- id: PW-CONT-G2-ROMEO-PROLOGUE-LOCAL-LEGITIMACY
  event_ref: PW-EVT-G2-ROMEO-POST-CORONADO-PROLOGUE
  rule: >-
    Romeo is tasked to establish contact, assess, support, and develop credible local actors.
    Do not frame him as ordered to seize civilian leadership, impose an outside organization,
    or use the local population as a disposable proxy force.

- id: PW-CONT-G2-ROMEO-PROLOGUE-DELTA-SEPARATION
  event_ref: PW-EVT-G2-ROMEO-POST-CORONADO-PROLOGUE
  rule: >-
    Fire Team Delta does not accompany Romeo into the opening Calloway insertion. Preserve
    the later HIGH GROUND reunion. Dingo, Howler, and Beaver's exact interim assignments
    remain open.

- id: PW-CONT-G2-ROMEO-PARALLEL-SOUTHERN-ADVANCE
  event_ref: PW-EVT-G2-ROMEO-POST-CORONADO-PROLOGUE
  rule: >-
    A mobile U.S. counteroffensive advances east from California along a broadly southern
    axis toward and across the Mississippi, then turns northeast toward Appalachian and
    Virginia approaches. Keep exact units, states, crossings, and dates open until dedicated
    national-campaign mapping. Do not make this a playable Romeo transcontinental ladder.

- id: PW-CONT-G2-ROMEO-PROLOGUE-CUMBERLAND-CONVERGENCE
  sequence:
  - PW-EVT-G2-ROMEO-POST-CORONADO-PROLOGUE
  - PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    TRI-STATE POINT pays off PATHFINDER's two-line plan. The AFC contributes local
    intelligence, routes, network depth, and civilian legitimacy; conventional forces
    contribute mass, engineers, aviation, and sustained exploitation. Cumberland Gap is
    a delayed convergence of complementary plans, not an accidental meeting of forces.

