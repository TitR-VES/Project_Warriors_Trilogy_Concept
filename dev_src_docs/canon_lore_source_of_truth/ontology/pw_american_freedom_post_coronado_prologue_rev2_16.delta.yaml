operations:
- op: add_events
  values:
  - id: PW-EVT-G2-ROMEO-POST-CORONADO-PROLOGUE
    name: PATHFINDER
    event_name: American Freedom post-Coronado prologue
    era: PW-ERA-WWIII
    date:
      relative: after PW-EVT-G1-ROMEO-CORONADO and before LOW GROUND; exact date TBD
    location: surviving U.S. command and briefing site / exact location TBD; covert movement toward Calloway, Kentucky
    actors:
    - Ramón Álvarez / Romeo
    - surviving U.S. special-operations command personnel
    - U.S. government intelligence and law-enforcement representatives
    - Russian occupation communications and traffic-analysis targets
    depicted_in: [PW-TRK-G2-AMERICAN-FREEDOM]
    status: confirmed_story_bridge_and_title_with_production_details_open
    notes: >-
      PATHFINDER is the canonical prologue title. It describes Romeo's strategic function,
      not a new callsign, unit, rank, or formal billet. After Coronado, Romeo's valor and
      record across the European withdrawal, AEGIS infrastructure defense, California
      return, and North Island battle are recognized internally by surviving senior command.
      He remains a staff sergeant; the recognition changes his access and assignment rather
      than his rank. A compartmented surviving special-operations/interagency planning cell
      shows him decrypted Russian occupation communications indicating low but persistent
      organized resistance activity around Calloway, Kentucky. Romeo is selected for an
      individual covert insertion to establish contact, assess security and legitimacy, and
      help develop communications, routes, logistics, intelligence handling, and operational
      discipline over time. Fire Team Delta does not accompany the opening insertion. The
      briefing also establishes a parallel mobile U.S. counteroffensive advancing east from
      California on a southern axis toward and across the Mississippi before turning
      northeast toward Appalachian and Virginia approaches. The two plans converge at
      Cumberland Gap later in the campaign. Exact date, briefing site, participants,
      insertion route, and conventional order of battle remain open.
    relations:
      prior_sequence:
      - NORTH ISLAND / CORONADO
      next_sequence:
      - LOW GROUND
      strategic_parallel:
      - southern-route mobile U.S. counteroffensive from California toward the Mississippi and Virginia approaches
      later_convergence:
      - PW-EVT-G2-ROMEO-TRI-STATE-POINT
    sources:
    - dev_src_docs/story_campaigns/Game2/Playable_Characters/Romeo/PW_AMERICAN_FREEDOM_Post_Coronado_Prologue_Bridge_2026-07-31_rev1.txt

- op: update_campaign
  match_id: PW-CMP-G2-AMERICAN-FREEDOM
  set:
    status: locked_campaign_ladder_with_pathfinder_prologue_and_selected_production_details_open
    notes: >-
      PATHFINDER is the canonical post-Coronado prologue. Romeo receives internal
      recognition after Coronado, enters a compartmented special-operations/interagency
      planning circle, and is individually tasked to investigate and develop low-signature
      resistance activity around Calloway. In parallel, mobile U.S. formations advance east
      from California along a southern route and later turn northeast. The two operational
      lines converge during TRI-STATE POINT. PATHFINDER does not change Romeo's SSG rank,
      function as a callsign or unit identity, bring Fire Team Delta into the Calloway
      opening, or turn American Freedom into a playable transcontinental counteroffensive.
    sources:
    - dev_src_docs/story_campaigns/Game2/Playable_Characters/Romeo/PW_AMERICAN_FREEDOM_Post_Coronado_Prologue_Bridge_2026-07-31_rev1.txt
    - dev_src_docs/story_campaigns/Game2/Playable_Characters/Romeo/PW_AMERICAN_FREEDOM_Campaign_Story_and_Mission_Ladder_2026-07-31_rev1.txt

- op: update_campaign_track
  match_id: PW-TRK-G2-AMERICAN-FREEDOM
  set:
    status: locked_campaign_ladder_with_pathfinder_tasking_and_cumberland_gap_convergence
    notes: >-
      Chronology begins with NORTH ISLAND/CORONADO -> PATHFINDER -> LOW GROUND. Romeo is
      inserted individually into occupied eastern Kentucky while a wider mobile U.S.
      counteroffensive advances east on a southern axis. Fire Team Delta reunites later in
      HIGH GROUND. The local AFC line and conventional mobile line converge at TRI-STATE
      POINT, after which the preserved Cumberland corridor supports movement toward Virginia
      and the NO KINGS bridge. Exact dates and detailed national route remain open.
    sources:
    - dev_src_docs/story_campaigns/Game2/Playable_Characters/Romeo/PW_AMERICAN_FREEDOM_Post_Coronado_Prologue_Bridge_2026-07-31_rev1.txt
