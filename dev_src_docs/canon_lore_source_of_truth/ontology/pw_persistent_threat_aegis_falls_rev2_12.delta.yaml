continuity_constraints:
- id: PW-CONT-G2-DUCKY-AEGIS-FALLS-TWO-ARM
  sequence:
  - HULL BREACH / Tremblay ZEUS credential and Volkov records
  - post-HULL-BREACH off-book Walker tasking
  - Crodyn address and 0600 Tremblay anomaly
  - pre-positioned Aix and Danish operational arms
  - AEGIS heuristic threat event and Tremblay suppression override
  - staging-complete / device-preparation red line
  - simultaneous Denmark interception and Aix estate entry
  - Ducky live-feed confrontation
  - Tremblay conditional surrender to Walker's process
  note: >-
    Do not separate the maritime and estate operations into different missions or stage
    them as a simple sequential travel handoff. AEGIS squad remains at Aix; Nereid Black
    and SHIELD own the deployment-vessel assault; the Royal Danish Navy owns the support-
    vessel interception. Tremblay normalizes the warning disposition but does not erase
    the vessels from AEGIS observation. TRU/SIGHT continues covert tracking through limited
    emergency-contingency access.

- id: PW-CONT-G2-DUCKY-AEGIS-FALLS-TREMBLAY-CULPABILITY
  rule: >-
    Tremblay is a coerced but culpable accessory. Russian blackmail based on prior override
    records explains his reluctance and decision but does not exonerate him. Do not portray
    him as the mastermind commanding the sabotage team or as an innocent victim whose
    credential was used without his knowledge.

- id: PW-CONT-G2-DUCKY-AEGIS-FALLS-CONTRACTOR-PORTRAYAL
  rule: >-
    Support-vessel contractor nationality is not evidence of criminality. Russian planners
    recruit affordable, adequately trained, deniable personnel with limited European ties
    and exploit racialized assumptions that cause casual observers to misread them as
    ordinary foreign merchant crew. Distinguish legitimate or coerced maritime crew,
    contractor security personnel, and the Russian coordination element.

