    notes: >-
      Single synchronized two-arm finale. AEGIS squad is pre-positioned at Tremblay's
      Aix-en-Provence estate while Nereid Black and SHIELD interdict a covert deployment
      vessel staging an attack on a strategic Danish undersea cable terminal; the Royal
      Danish Navy intercepts the support vessel. Both ships disable transponders but remain
      under AEGIS non-cooperative track. AEGIS's autonomous watcher detects matching
      pre-attack behavior and would propagate a warning. Under FSB / SVR coercion based on
      preserved records of prior suppressions, Tremblay uses his ZEUS credential to
      normalize the vessels as legitimate traffic. He suppresses warning propagation but
      does not erase raw tracks or make the ships invisible. TRU/SIGHT uses limited
      contingency access to preserve the track, detect the override, correlate attacker
      communications, and assemble the proof package. The intervention red line is staging
      complete and device preparation beginning. ORACLE triggers both arms. Nereid Black
      and SHIELD secure the deployment vessel and sabotage device; Danish forces capture
      the support ship. Ducky enters Tremblay's study alone and uses a secure live helmet-
      camera feed of the vessel sweep as understated pressure. Tremblay is a culpable
      accessory, not the attack mastermind. He conditionally surrenders to Walker's process
      with the condition that Crodyn not be protected. Protected ending: “AEGIS falls
      regardless.” / “Then we build something better.”
