meta:
  generated: '2026-08-14'
  revision: rev1
schema:
  document: world_geography_chronology
  top_level_required:
  - meta
  - exact_calendar_anchors
  - feature_overlay
  - kml_anchor_overlay
  - governance
  anchor_id_pattern: PW-TIME-{NAME}
  anchor_fields:
    id: {type: string, required: true}
    name: {type: string, required: true}
    when: {type: date, required: true}
    precision: {type: enum, values: [day, month, year], required: true}
    status: {type: enum, values: [locked, bounded, working], required: true}
    source: {type: string, required: true}
    geography_note: {type: string, required: false}
  chronology_status_values:
  - unresolved
  - relative_locked
  - relative_window_locked
  - theater_anchor_locked_feature_time_open
  - event_bound_date_open
  validation_rules:
  - Never derive an exact calendar date from relative ordering alone.
  - A theater-level anchor does not become the onset date of every spatial state inside that theater.
  - Direct KML TimeStamp or TimeSpan on an existing PW-GEO feature requires source support for that feature's own temporal state.
  - Superseded date variants must not be reintroduced.
  - Relative chronology may reference stable event, campaign, track, or PW-TIME anchor identities without creating a calendar date.
