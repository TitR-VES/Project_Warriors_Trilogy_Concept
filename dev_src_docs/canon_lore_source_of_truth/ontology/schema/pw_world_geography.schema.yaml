meta:
  generated: '2026-08-14'
  revision: rev1
  governance: Validates the Project Warriors additive world-geography reference registry. Detailed geometry remains
    in the source KML; this registry projects stable geographic identities and cross-references without turning
    every spatial state into a timeline event.
schema:
  document: world_geography_reference
  top_level_required:
  - meta
  - source_map
  - features
  id_pattern: PW-GEO-{NAME}
  geometry_type_values:
  - Point
  - LineString
  - Polygon
  - MultiGeometry
  - Unknown
  feature_role_values:
  - point_reference
  - location_reference
  - event_anchor
  - linear_geography_reference
  - operational_movement_corridor
  - area_reference
  - event_footprint
  - territorial_control_or_denial_area
  - mixed_reference
  source_stage_values:
  - carried_forward_prior_map
  - carried_forward_geometry_corrected_2026-08-14
  - new_overlay_2026-08-14
  feature_fields:
    id:
      type: string
      required: true
    placemark_ordinal:
      type: integer
      required: true
    name:
      type:
      - string
      - 'null'
      required: true
    geometry_type:
      type: enum
      required: true
    feature_role:
      type: enum
      required: true
    source_stage:
      type: enum
      required: true
    vertex_count:
      type: integer
      required: true
    bbox:
      type: object
      required: false
    centroid:
      type: object
      required: false
    description:
      type:
      - string
      - 'null'
      required: false
    repo_cross_reference:
      type:
      - string
      - 'null'
      required: false
    ontology_treatment:
      type: string
      required: true
  validation_rules:
  - Feature IDs must be unique.
  - Placemark ordinals must be unique within one source-map revision.
  - Detailed coordinate arrays remain in the KML; the registry stores only summary geometry.
  - Unnamed placemarks may retain null names and must not receive invented narrative identities.
  - A geography feature may reference an event, track, or campaign but does not create one automatically.
  - Territorial-control and blockade polygons are persistent spatial states unless a narrative source separately
    defines a transition event.
  - Exact dates must not be inferred from placemark order or map proximity.
