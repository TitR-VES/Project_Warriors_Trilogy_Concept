- op: add_events
  values:
  - id: PW-EVT-G2-ROMEO-TRI-STATE-POINT
    name: TRI-STATE POINT
    event_name: Battle of Cumberland Gap
    era: PW-ERA-WWIII
    date:
      relative: after AMBITIOUS and before Romeo's Game 3 NO KINGS campaign; exact date TBD
    ordering:
      after: [AMBITIOUS]
      before: [PW-TRK-G3-NO-KINGS]
    location: Cumberland Gap corridor; Cumberland Gap, Tennessee; Virginia-Tennessee-Kentucky tri-state region
    actors:
    - Ramón Álvarez / Romeo
    - Fire Team Delta
    - American Freedom Corps
    - forward United States Army elements
    - Army engineers
    - Hornet 2 / AH-6M Little Bird
    - Sparrow 5 / MH-6M Little Bird
    - Vyacheslav Glushkin
    - Russian occupation forces
    depicted_in: [PW-TRK-G2-AMERICAN-FREEDOM]
    status: confirmed_plot_architecture_production_details_open
    notes: >-
      Mission 16 and AMERICAN FREEDOM finale. AFC and forward Army elements liberate the
      Cumberland Gap corridor, preserve both tunnel portals, defeat organized Russian
      resistance in Cumberland Gap, and open the route for a larger northeastward
      counteroffensive. Romeo's team seizes the western-portal checkpoint and prevents
      detonation of pre-planted demolition charges. Two uparmored Tigr-M patrol vehicles
      with open-topped Kord heavy-machine-gun stations counterattack. Hornet 2, an AH-6M,
      destroys the lead vehicle and destabilizes the second with a near rocket impact;
      the second vehicle hits the right shoulder and rolls into the ditch onto its right
      side. Sparrow 5, an MH-6M, extracts Romeo's team to the pre-assault staging point.
      The aviation sequence remains fully player-controlled first person. Hornet 2 then
      supports the eastern-portal push. After the town battle is won, Romeo confronts
      burned Glushkin in a quiet house at the edge of town. Glushkin's resolution does not
      cause the liberation. The campaign ends with larger American formations moving
      through the preserved corridor, creating the physical and thematic bridge to NO KINGS.
    relations:
      prior_sequence:
      - AMBITIOUS / DARK-SIGNAL-COST compound operation
      - ANGEL escape sequence / SPECTRE FOUR ONE intervention
      contains_phases:
      - corridor shaping and high-ground approach
      - western-portal demolition-denial action
      - Hornet 2 / Sparrow 5 Little Bird intervention
      - pre-assault relocation
      - eastern-portal and Cumberland Gap town assault
      - quiet-house Glushkin confrontation
      - corridor-opening end state
    sources:
    - dev_src_docs/story_campaigns/Game2/Playable_Characters/Romeo/PW_TRI_STATE_POINT_Cumberland_Gap_Mission_Source_2026-07-31_rev1.txt

