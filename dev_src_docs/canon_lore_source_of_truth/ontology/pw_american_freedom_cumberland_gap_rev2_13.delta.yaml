    notes: >-
      Hard-order ladder: untitled prologue -> LOW GROUND -> DEAD AIR -> THE REDBUD
      VEHICLES -> FARM ROAD -> SECOND LEVEL -> THREE COUNTIES -> FREQUENCY -> OTHER
      TOWNS -> AMERICAN FREEDOM -> HARGROVE'S RECORD -> HIGH GROUND -> Crodyn address ->
      FREE GROUND -> LONG VIEW -> GLUSHKIN'S MAP -> optional FACE TO FACE -> AMBITIOUS ->
      TRI-STATE POINT. THREE COUNTIES absorbs NEIGHBOR; OTHER TOWNS incorporates PRIYA'S
      GROUND; HARGROVE'S RECORD incorporates WASHINGTON'S WALL consequences; HARD GROUND
      is the opening movement of FREE GROUND; LONG VIEW incorporates SUPPLY AND DEMAND;
      AMBITIOUS contains DARK, SIGNAL, COST, and ANGEL; TRI-STATE POINT is the Battle of
      Cumberland Gap finale. Exact dates, prologue title, FACE TO FACE placement, detailed
      eastern-portal route, and Glushkin consequence implementation remain open.

continuity_constraints:
- id: PW-CONT-G2-ROMEO-LADDER-SPINE
  campaign_ref: PW-CMP-G2-AMERICAN-FREEDOM
  sequence:
  - LOW GROUND
  - DEAD AIR
  - THE REDBUD VEHICLES
  - FARM ROAD
  - SECOND LEVEL
  - THREE COUNTIES
  - FREQUENCY
  - OTHER TOWNS
  - AMERICAN FREEDOM
  - HARGROVE'S RECORD
  - HIGH GROUND
  - Crodyn wartime presidential address
  - FREE GROUND
  - LONG VIEW
  - GLUSHKIN'S MAP
  - AMBITIOUS
  - TRI-STATE POINT
  note: FACE TO FACE may occur conditionally between GLUSHKIN'S MAP and AMBITIOUS without altering the hard mandatory sequence.

- id: PW-CONT-G2-ROMEO-ANGEL-PLACEMENT
  rule: >-
    ANGEL belongs to the AMBITIOUS escape sequence. Do not move the improvised F-150/M240B
    pursuit, SPECTRE FOUR ONE intervention, flare-wing image, or “American Freedom, over”
    line into TRI-STATE POINT.

- id: PW-CONT-G2-ROMEO-CUMBERLAND-INFRASTRUCTURE
  event_ref: PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    The modern tunnel/highway corridor is the principal heavy-logistics objective. The
    historic pass and surrounding high ground support infantry, reconnaissance, observation,
    and approach control. The mission's victory requires preserving the corridor, not merely
    clearing enemies from a tunnel interior.

- id: PW-CONT-G2-ROMEO-LITTLE-BIRD-INTERVENTION
  event_ref: PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    Hornet 2 is the AH-6M CAS/overwatch aircraft and Sparrow 5 is the MH-6M extraction
    aircraft. Their western-portal arrival, rocket attack, pickup, and relocation remain
    player-controlled first-person gameplay with only subtle cancellable view guidance.
    The second Tigr's controlling resting state is on its right side in the ditch.

- id: PW-CONT-G2-ROMEO-GLUSHKIN-FINALE
  event_ref: PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    Glushkin's burn notice precedes the final confrontation. Romeo meets him in a quiet house
    at the edge of Cumberland Gap only after organized Russian resistance has collapsed.
    Glushkin's personal resolution does not win the battle and must not become sudden
    redemption, surrender negotiation, or a fortified boss encounter.

- id: PW-CONT-G2-ROMEO-NO-KINGS-BRIDGE
  sequence:
  - PW-EVT-G2-ROMEO-TRI-STATE-POINT
  - PW-TRK-G3-NO-KINGS
  rule: >-
    Friendly control of the Cumberland Gap corridor enables larger U.S. forces to move
    northeast while the AFC identity spreads beyond Romeo's direct control. Game 2 opens
    the route and movement; it does not complete the national restoration depicted later.

