governance:
- A calendar anchor date may contextualize a geography feature without becoming that
  feature’s own onset date.
- Do not assign a TimeStamp to a territorial-control polygon merely because the theater
  offensive began on a locked date.
- Use TimeSpan only when both the represented state/event and the range boundary are
  source-locked.
- Relative-only facts such as after Game 1 / before Game 2 remain relative-only until
  a later source provides calendar placement.
- Exact dates in superseded sources do not control over later explicit owner locks.
- Future chronology passes should append bindings and KML time primitives without
  renumbering PW-GEO identities.
