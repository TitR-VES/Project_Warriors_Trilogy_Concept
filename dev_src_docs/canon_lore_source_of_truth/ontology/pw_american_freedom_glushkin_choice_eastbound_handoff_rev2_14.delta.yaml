continuity_constraints:
- id: PW-CONT-G2-ROMEO-GLUSHKIN-PLAYER-CHOICE
  event_ref: PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    The final Glushkin scene remains seamless first person. Glushkin does not force the
    outcome through an attack or weapon reach. The player may shoot him or order capture.
    No morality UI, timer, QTE, or authorial declaration makes one branch correct. Do not
    call the kill branch an objective honorable death in battle, and do not fix the capture
    branch's legal category without later law-of-armed-conflict review.

- id: PW-CONT-G2-ROMEO-BEAVER-REGIONAL-HANDOFF
  event_ref: PW-EVT-G2-ROMEO-TRI-STATE-POINT
  rule: >-
    Beaver remains in the Cumberland Gap / Tri-County area and assumes Romeo's day-to-day
    military coordination duties in partnership with civilian organizers, local AFC cells,
    Priya, Aldridge, Army engineers, and the hold force. He does not displace civilian
    authority or become the region's sole political leader.

- id: PW-CONT-G2-G3-ROMEO-EASTBOUND-COMPANIONS
  sequence:
  - PW-EVT-G2-ROMEO-TRI-STATE-POINT
  - PW-EVT-G2-G3-ROMEO-KENTUCKY-BOSTON-BRIDGE
  - PW-EVT-G3-NO-KINGS-EASTBOUND
  rule: >-
    Romeo departs Cumberland Gap with Dingo and Howler. They are the two trusted companions
    in EASTBOUND. Beaver remains in Kentucky. The journey continues through a meaningful
    inter-campaign relay-state interval rather than a direct convoy drive to Boston.

