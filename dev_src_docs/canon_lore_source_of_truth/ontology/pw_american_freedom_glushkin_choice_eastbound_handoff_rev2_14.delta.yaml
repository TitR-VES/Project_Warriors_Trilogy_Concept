    notes: >-
      Mission 16 and AMERICAN FREEDOM finale. After the corridor and town are liberated,
      Romeo reaches burned Glushkin in a quiet house through seamless first-person play.
      The final dialogue does not force a hostile move. The player may either shoot
      Glushkin or order his capture alive. The kill branch is not mislabeled as a
      conventional death in battle; the capture branch transfers him into U.S. military
      and intelligence custody without prematurely fixing his final legal classification.
      Both branches preserve the same liberation and corridor outcome. Afterward, the
      combined force divides. Beaver remains in the Tri-County / Cumberland Gap area and
      assumes Romeo's day-to-day military coordination duties inside the regional AFC
      structure. Romeo, Dingo, and Howler join the northeast mobile element and begin the
      months-spanning relay-state bridge toward Boston.
    relations:
      player_choice:
      - kill Glushkin after the final exchange without a forced hostile action
      - capture Glushkin alive and transfer him into U.S. custody
      force_disposition:
        cumberland_hold_and_regional_support:
        - Beaver
        - AFC regional cells and civilian organizers
        - selected forward Army security, engineering, medical, logistics, and liaison personnel
        northeast_mobile_element:
        - Romeo
        - Dingo
        - Howler
        - selected mobile Army and AFC elements
      bridge_to:
      - PW-EVT-G2-G3-ROMEO-KENTUCKY-BOSTON-BRIDGE
